[workspace]
resolver = "2"
members = [
    "crates/rusty-rpc",
    "crates/rusty-net",
    "crates/rusty-service",
    "crates/rusty-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
rusty-rpc = { path = "crates/rusty-rpc" }
rusty-net = { path = "crates/rusty-net" }
