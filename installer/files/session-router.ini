[router]
data-dir=data

[network]
keyfile=client.key
ifname=sr-tun0
ifaddr=10.192.0.1/16
ifaddr=fd2e:7365:7368::1/64
auto-routing=true

[dns]
listen=127.0.0.1:53
# Resolver used once an exit is mapped; queries reach it through the exit.
upstream=1.1.1.1

[api]
enabled=true
bind=tcp://127.0.0.1:1190

[bootstrap]
add-node=bootstrap.signed

[logging]
level=info
type=file
file=session-router.log
